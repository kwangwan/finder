services:
  backend:
    build: ./backend
    image: knowledge-base-backend:${TAG:-latest}
    env_file: .env
    volumes:
      - ./backend/storage_data:/app/storage_data
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: knowledge-base-frontend:${TAG:-latest}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  sync:
    build: ./sync-server
    image: knowledge-base-sync:${TAG:-latest}
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8001
    ports:
      - "1234:1234"
    depends_on:
      - backend
    restart: unless-stopped
