services:
  backend:
    build: ./backend
    image: knowledge-base-backend:${TAG:-latest}
    env_file: .env
    volumes:
      - ./backend/storage_data:/app/storage_data
    ports:
      # Host-local only. nginx reaches this over the compose network
      # (http://backend:8001) and the tunnel runs on this machine, so nothing
      # outside needs it — published on every interface it was an unproxied
      # copy of the whole API, docs included, to anyone on the network.
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: knowledge-base-frontend:${TAG:-latest}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  sync:
    build: ./sync-server
    image: knowledge-base-sync:${TAG:-latest}
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8001
    ports:
      # Host-local only, for the same reason: the tunnel connects from here.
      - "127.0.0.1:1234:1234"
    depends_on:
      - backend
    restart: unless-stopped
