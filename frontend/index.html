<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- The browser chrome follows the same setting the page does. -->
    <meta name="theme-color" content="#0a0d14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Project Run : Finder</title>
    <meta name="description" content="Project Run : Finder - AI 시맨틱 검색과 클라우드 스토리지가 결합된 지식 관리 플랫폼" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Before the first paint, so a light-mode machine does not flash the
      // dark palette while React boots. The app re-applies this on mount and
      // keeps following the system setting while it runs.
      (function () {
        try {
          var saved = localStorage.getItem('kb_theme');
          var choice = saved === 'dark' || saved === 'light' ? saved
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', choice);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
