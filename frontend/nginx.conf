server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Media streaming (video/audio/PDF preview and direct download). These
    # must pass bytes through as they arrive: with nginx's default
    # proxy_buffering on, nginx reads the whole upstream response into its
    # buffers (spilling to a temp file) before forwarding any of it, which
    # re-introduces the very stall the backend's streaming ranged responses
    # exist to remove. Declared before the generic /api/ block so it wins for
    # these two prefixes only — everything else keeps buffering, which is the
    # better default for ordinary JSON responses.
    location ~ ^/api/storage/(preview|download)/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 300s;
    }

    # Taskbar sync stream (Server-Sent Events). A long-lived response that
    # sends a few bytes at a time, so it needs the same unbuffered pass-through
    # as media plus a read timeout longer than the stream's own keep-alive
    # interval — under the generic /api/ block's 60s default nginx would cut a
    # perfectly healthy connection every minute.
    location = /api/window-state/stream {
        proxy_pass http://backend:8001/api/window-state/stream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 1h;
    }

    location /api/ {
        # Frontend sends files <=5MB as a single direct-upload request (see
        # uploadFileChunked's chunkSize) — nginx's 1m default rejects those
        # with 413 before the request ever reaches the backend.
        client_max_body_size 20m;
        proxy_pass http://backend:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints every bundle (assets/index-<hash>.js), so a given
    # asset URL can never change content — cache it hard and skip the
    # revalidation round trip entirely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html must NOT be cached. It carries the <script src> pointing
        # at the current hashed bundle, so a stale copy pins the browser to a
        # previous deploy's JavaScript indefinitely — the user keeps loading
        # old code and every shipped fix looks like it never landed. nginx
        # sends only ETag/Last-Modified here by default, with no
        # Cache-Control, which lets browsers apply *heuristic* freshness and
        # reuse the file without revalidating at all. Force revalidation.
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
